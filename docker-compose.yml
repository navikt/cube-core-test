services:
  cube:
    image: cubejs/cube:latest
    ports:
      - "4001:4000"
    volumes:
      - ./cube.js:/cube/conf/cube.js
      - ./model:/cube/conf/model
      # Mount host ADC credentials so BigQuery auth works locally
      - ~/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cube_dev
      POSTGRES_USER: cube
      POSTGRES_PASSWORD: cube
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
